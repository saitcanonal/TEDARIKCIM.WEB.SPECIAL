<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kayıt · TEDARİKÇİM</title><meta name="description" content="TEDARİKÇİM: işletmeler için tedarikçi bulma ve fiyat karşılaştırma platformu."><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"></head>
<body data-page="register"><header></header><main>
<div class="wrap"><form class="card auth" id="registerForm"><h2>Kayıt Ol</h2><div id="msg" class="note" hidden role="alert"></div><label class="field"><span>Ad Soyad</span><input name="name" required autocomplete="name"></label><label class="field"><span>E-posta</span><input name="email" type="email" required autocomplete="email"></label><label class="field"><span>Telefon</span><input name="phone" type="tel" required placeholder="0532 000 00 00" autocomplete="tel"></label><label class="field"><span>Şifre (en az 8 karakter, harf + rakam)</span><input name="password" type="password" minlength="8" required autocomplete="new-password"></label><label class="field"><span>Kullanım tipi</span><select name="userType"><option value="customer">Müşteri</option><option value="supplier">Tedarikçi</option><option value="both">Müşteri + Tedarikçi</option></select></label><button class="btn" style="width:100%">Kayıt Ol</button><p class="muted">Zaten üyeyseniz <a href="/giris"><b>giriş yapın</b></a></p></form></div>
</main><footer></footer><script src="/js/app.js"></script></body></html>
